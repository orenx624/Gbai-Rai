<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondages Flash - Gbai-Rai</title>
    <link rel="stylesheet" href="CSS/common.css">
    <link rel="stylesheet" href="CSS/index.css">
</head>
<body class="page-sondages">
    <header class="site-header">
        <div class="logo-wrapper">
            <a href="index.html" class="back-link" aria-label="Retour">←</a>
            <h1 class="app-title">Sondages<span>-</span>Flash</h1>
        </div>
        <nav class="site-nav">
            <a href="index.html">Accueil</a>
            <a href="clash.html">Clashs</a>
            <a href="classement.html">Classement<sup>2</sup></a>
        </nav>
    </header>

    <main class="container">
        <div class="welcome-box">
            <h1>📊 Sondages Flash</h1>
            <p>Vote anonymement et découvre les tendances en direct.</p>
        </div>

        <!-- 1. Zone de proposition placée EN HAUT -->
        <div class="create-poll-card" style="margin-bottom: 2rem;">
            <h3>💡 Une idée de sondage ?</h3>
            <p>Propose ta question, elle sera validée puis mise au vote.</p>
            <textarea class="custom-input" id="new-poll-input" placeholder="Écris ta question ici..."></textarea>
            <button class="btn-primary" id="submit-poll-btn">Proposer mon sondage</button>
        </div>

        <!-- 2. Conteneur dynamique qui recevra TOUS les sondages -->
        <div id="polls-list-container">
            <!-- Injecté dynamiquement par JS -->
        </div>
    </main>

    <script src="JS/sondages.js"></script>
</body>
</html>
