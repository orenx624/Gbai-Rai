<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration PhotoClash - Gbai-Rai</title>
    <link rel="stylesheet" href="CSS/common.css">
    <link rel="stylesheet" href="CSS/index.css">
    <link rel="stylesheet" href="CSS/param-photo.css">
    
</head>
<body class="page-admin-photoclash">
    <header class="site-header" id="admin-header">
        <div class="logo-wrapper">
            <a href="admin.html" class="back-link" aria-label="Retour à la console" title="Retour à la console">←</a>
            <div class="logo">Gbai<span>-</span>Rai <small style="font-size: 0.6em; color: var(--red);">[Admin PhotoClash]</small></div>
        </div>
        <nav class="site-nav">
            <a href="index.html">Accueil</a>
            <a href="admin.html">Console Admin</a>
        </nav>
    </header>

    <main class="container" style="margin-top: 2rem;">
        <section id="photo-clash-settings" class="admin-section">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h2>📸 PhotoClash</h2>
            </div>

            <div class="section-body" style="display: grid; gap: 1rem; margin-top: 1rem;">
                <!-- MODÉRATION -->
                <div class="card admin-panel-card admin-card-section">
                    <div class="card-header">
                        <h3>💬 Modération des Commentaires</h3>
                    </div>
                    <div style="display: grid; gap: 1rem; margin-top: 0.5rem;">
                        <select id="mod-participant-selector" style="width: 100%; padding: 0.8rem; background: rgba(15,23,42,0.95); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 1rem;">
                        </select>
                        <div id="mod-comments-stream" style="max-height: 300px; overflow-y: auto; display: grid; gap: 0.8rem; padding-right: 0.5rem;"></div>
                    </div>
                </div>

                <!-- RECRUTEMENT -->
                <div class="card admin-panel-card admin-card-section">
                    <div class="card-header">
                        <h3>🎯 Nouveau Candidat</h3>
                    </div>
                    <div style="display: grid; gap: 0.8rem; margin-top: 0.5rem;">
                        <input id="new-candidate-name" type="text" placeholder="Nom ou Pseudonyme" style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; color: #fff;">
                        <div style="display: grid; gap: 0.4rem;">
                            <label style="font-size: 0.85rem; color: var(--text-muted);">📷 Importer une image :</label>
                            <input id="new-candidate-file" type="file" accept="image/*" style="width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.85rem;">
                        </div>
                        <input id="new-candidate-photo" type="url" placeholder="Ou URL d'image (Optionnel)" style="width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; color: #fff;">
                        <select id="new-candidate-gender" style="width: 100%; padding: 0.8rem; background: rgba(15,23,42,0.95); border: 1px solid var(--border); border-radius: 8px; color: #fff;">
                            <option value="M">Masculin (Roi)</option>
                            <option value="F">Féminin (Reine)</option>
                        </select>
                        <button id="add-candidate-btn" class="btn btn-secondary" style="font-weight: bold; padding: 0.8rem; cursor: pointer;">Déployer le Candidat</button>
                    </div>
                </div>

                <!-- GESTION COMPLÈTE CANDIDATS -->
                <div class="card admin-panel-card admin-card-section">
                    <div class="card-header">
                        <h3>🛠️ Liste des Candidats</h3>
                    </div>
                    <div id="participant-management-list" style="display: grid; gap: 0.8rem; margin-top: 0.5rem;"></div>
                </div>

                <!-- CONFIGURATION DES TEXTES & COMMANDES -->
                <div class="card admin-panel-card admin-card-section">
                    <div class="card-header">
                        <h3>⚙️ Configuration & Réinitialisation</h3>
                    </div>
                    <div style="display: grid; gap: 0.8rem; margin-top: 0.5rem;">
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Titre Global du Clash</label>
                        <input id="cfg-clash-title" type="text" style="width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: #fff;">
                        
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Description d'en-tête</label>
                        <textarea id="cfg-clash-desc" rows="2" style="width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: #fff; resize: vertical;"></textarea>
                        
                        <button id="save-cfg-btn" class="btn btn-primary" style="margin-top: 0.5rem; font-weight: bold;">Mettre à jour l'application</button>
                        
                        <hr style="border: 0; border-top: 1px solid var(--border); margin: 1rem 0;">
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                            <button id="global-reset-votes" class="btn btn-soft" style="color: var(--red); font-size: 0.8rem; padding: 0.6rem;">RAZ Votes</button>
                            <button id="global-clear-comments" class="btn btn-soft" style="color: var(--red); font-size: 0.8rem; padding: 0.6rem;">RAZ Coms</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
<script src="JS/auth-guard.js"></script>
<script src="JS/admin-console.js"></script>
</body>
</html>>
